monitor.alsa.rules = [
  {
    matches = [
      {
        node.name = "~alsa_input.*Blue_Microphones_Yeti.*"
      }
    ]
    actions = {
      update-props = {
        priority.session = 2000
      }
    }
  }
  {
    matches = [
      {
        node.name = "~alsa_input.*C920.*"
      }
    ]
    actions = {
      update-props = {
        priority.session = 1500
      }
    }
  }
]
