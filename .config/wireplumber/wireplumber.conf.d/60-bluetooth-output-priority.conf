# Pick the default sink purely by priority instead of restoring the last
# manually-chosen device, so the headphones always win when they're connected
# and the speaker takes over when they're not.
wireplumber.settings = {
  node.restore-default-targets = false
}

monitor.bluez.rules = [
  {
    # soundcore Space One headphones
    matches = [ { node.name = "~bluez_output.E8_EE_CC_EF_1E_11.*" } ]
    actions = { update-props = { priority.session = 3000, priority.driver = 3000 } }
  }
  {
    # Klipsch One II speaker
    matches = [ { node.name = "~bluez_output.7C_96_D2_95_EB_91.*" } ]
    actions = { update-props = { priority.session = 2500, priority.driver = 2500 } }
  }
]
